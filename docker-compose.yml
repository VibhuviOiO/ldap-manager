services:
  ldap-manager:
    build: .
    container_name: ldap-manager
    ports:
      - "8000:8000"
      - "5173:5173"
    # Cluster bind passwords come from .env, one variable per cluster:
    #   LDAP_MANAGER_CLUSTER_<NAME>_PASSWORD   (and LDAP_MANAGER_CONFIG_<NAME>_PASSWORD)
    # See .env.example. Adding a cluster never requires editing this file.
    env_file:
      - path: .env
        required: false

    environment:
      - PYTHONUNBUFFERED=1
      - CONTEXT_PATH=${CONTEXT_PATH:-}
      - VITE_FOOTER_TEXT=${VITE_FOOTER_TEXT:-LDAP Manager • Built by <a href="https://vibhuvioio.com" target="_blank" class="text-primary hover:underline">Vibhuvi OiO</a>}
    volumes:
      - ./backend/app:/app/app
      - ./frontend/src:/frontend/src
      - ./frontend/vite.config.ts:/frontend/vite.config.ts
      - ./config.yml:/app/config.yml:ro