# ---------------------------------------------------------------------------
# Mode: local - built-in accounts, no external integration.
#
# On the first page load the UI shows a one-time wizard that creates an admin
# plus optional operator and viewer accounts. Passwords are hashed with scrypt
# and stored encrypted in the container at /app/.secrets/users.enc.
#
# Nothing else to configure: do NOT put passwords in this file.
#
# Validate:  python -m app.cli validate --config examples/auth-local.yml
# Run:       docker run -d --name ldap-manager -p 8000:8000 \
#              -v $PWD/examples/auth-local.yml:/app/config.yml:ro \
#              -v ldap-manager-secrets:/app/.secrets \
#              vibhuvioio/ldap-manager:latest
#
# Mount a volume on /app/.secrets (as above) or the accounts are lost when the
# container is recreated.
# ---------------------------------------------------------------------------
auth:
  mode: local
  session:
    lifetime_hours: 12

clusters:
  - name: "prod"
    host: "ldap.example.com"
    port: 389
    bind_dn: "cn=admin,dc=example,dc=com"
    base_dn: "dc=example,dc=com"
    description: "Production directory"
    # Bind password comes from the environment (or a mounted secret file). LDAP
    # Manager never stores it, so there is no UI step to enter it.
    credential:
      source: env   # LDAP_MANAGER_CLUSTER_PROD_PASSWORD
