apiVersion: v2
name: ldap-manager
description: Web UI and API to manage one or more OpenLDAP clusters (vibhuvioio/ldap-manager)
type: application
# Chart semver, independent of the image. appVersion is the LDAP Manager release
# the chart installs, and is what image.tag defaults to.
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.24.0-0"
icon: https://vibhuvioio.com/img/logo.svg
keywords:
  - ldap
  - openldap
  - ldap-manager
  - directory
  - identity
  - administration
  - web-ui
home: https://vibhuvioio.com/ldap-manager/
sources:
  - https://github.com/VibhuviOiO/ldap-manager
  - https://github.com/VibhuviOiO/ldap-manager-helmchart
maintainers:
  - name: Jinna Baalu
    url: https://github.com/VibhuviOiO
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: security
  artifacthub.io/images: |
    - name: ldap-manager
      image: vibhuvioio/ldap-manager:1.0.0
  # Artifact Hub requires kind/description pairs here; a bare list is rejected.
  artifacthub.io/changes: |
    - kind: added
      description: Initial chart - Deployment, config.yml ConfigMap, Secret wiring, PVCs for /app/.data and /app/.secrets
    - kind: added
      description: Ingress, probes and hardened securityContext
  artifacthub.io/links: |
    - name: Docker image
      url: https://hub.docker.com/r/vibhuvioio/ldap-manager
    - name: Image source
      url: https://github.com/VibhuviOiO/ldap-manager
