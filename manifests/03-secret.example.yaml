# EXAMPLE ONLY - not part of kustomization.yaml, and never apply it as-is.
#
# Prefer creating the Secret imperatively, so no password is ever written to a
# file in this repo:
#
#   kubectl -n ldap-manager create secret generic ldap-manager-secrets \
#     --from-literal=LDAP_MANAGER_CLUSTER_EXAMPLE_CLUSTER_PASSWORD='...' \
#     --from-literal=LDAP_MANAGER_CONFIG_EXAMPLE_CLUSTER_PASSWORD='...' \
#     --from-literal=LDAP_MANAGER_SECRET_KEY="$(openssl rand -hex 32)"
#
# The Deployment consumes every key in this Secret as an environment variable
# (envFrom), so a cluster whose config.yml says `credential: {source: env}` finds
# its password with no further wiring. LDAP_MANAGER_SECRET_KEY is optional at one
# replica; set it before scaling out, or every replica signs sessions with its
# own key.
apiVersion: v1
kind: Secret
metadata:
  name: ldap-manager-secrets
  labels:
    app.kubernetes.io/name: ldap-manager
    app.kubernetes.io/instance: ldap-manager
    app.kubernetes.io/component: app
type: Opaque
stringData:
  LDAP_MANAGER_CLUSTER_EXAMPLE_CLUSTER_PASSWORD: "replace-me"
  LDAP_MANAGER_CONFIG_EXAMPLE_CLUSTER_PASSWORD: "replace-me"
  LDAP_MANAGER_SECRET_KEY: "replace-with-openssl-rand-hex-32"
