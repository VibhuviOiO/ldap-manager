# config.yml for LDAP Manager.
#
# This is the file the app reads. The Deployment mounts it read-only as a
# directory at /etc/ldap-manager and sets LDAP_MANAGER_CONFIG accordingly, so
# editing this ConfigMap takes effect without a restart (the app re-reads the
# file on every request).
#
# Every value below is a placeholder. Replace host, bind_dn and base_dn with
# your own directory's details. The cluster name decides the environment
# variable that carries its bind password:
#   name: example-cluster -> LDAP_MANAGER_CLUSTER_EXAMPLE_CLUSTER_PASSWORD
# (upper-cased, every run of non-alphanumeric characters replaced by one _).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-manager-config
  labels:
    app.kubernetes.io/name: ldap-manager
    app.kubernetes.io/instance: ldap-manager
    app.kubernetes.io/component: app
data:
  config.yml: |
    # none | local | ldap
    #   none   a reverse proxy / SSO already authenticated the user
    #   local  built-in accounts, created in a first-run wizard
    #   ldap   a cluster below authenticates users
    auth:
      mode: none
      default_role: readonly
      session:
        lifetime_hours: 12

    clusters:
      - name: example-cluster
        host: ldap.example.com
        port: 389
        bind_dn: cn=admin,dc=example,dc=com
        base_dn: dc=example,dc=com
        description: Example LDAP cluster
        readonly: false
        # env (default) | file | config
        # env reads the password from the Secret wired into the Deployment.
        credential:
          source: env
