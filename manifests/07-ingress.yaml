# Ingress for the UI and API.
#
# The host below is a placeholder - change it to a name you control before
# applying, or remove this file from kustomization.yaml.
#
# CONTEXT_PATH interaction: with CONTEXT_PATH set (e.g. /ldap-manager) the app
# serves everything under that prefix, so route the same prefix here:
#
#   annotations:
#     nginx.ingress.kubernetes.io/rewrite-target: /$2
#   paths:
#     - path: /ldap-manager(/|$)(.*)
#       pathType: ImplementationSpecific
#
# TLS is intentionally not configured here. Add a tls: block plus the
# corresponding Secret (or a cert-manager annotation) in your own overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ldap-manager
  labels:
    app.kubernetes.io/name: ldap-manager
    app.kubernetes.io/instance: ldap-manager
    app.kubernetes.io/component: app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  # ingressClassName: nginx
  rules:
    - host: ldap-manager.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ldap-manager
                port:
                  name: http
