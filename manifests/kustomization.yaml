apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 03-secret.example.yaml is deliberately NOT listed: it holds placeholders.
# Create the real Secret first, then apply this.
#
#   kubectl -n ldap-manager create secret generic ldap-manager-secrets \
#     --from-literal=LDAP_MANAGER_CLUSTER_EXAMPLE_CLUSTER_PASSWORD='...' \
#     --from-literal=LDAP_MANAGER_CONFIG_EXAMPLE_CLUSTER_PASSWORD='...' \
#     --from-literal=LDAP_MANAGER_SECRET_KEY="$(openssl rand -hex 32)"
namespace: ldap-manager
resources:
  - 00-namespace.yaml
  - 01-serviceaccount.yaml
  - 02-configmap.yaml
  - 04-pvc.yaml
  - 05-deployment.yaml
  - 06-service.yaml
  # Remove this line if you do not have an ingress controller or have not set
  # 07-ingress.yaml's host to a name you control.
  - 07-ingress.yaml
